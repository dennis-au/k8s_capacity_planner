[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "kcp"
version = "0.1.4"
description = "Dark-site Kubernetes capacity planner"
requires-python = ">=3.13"
dependencies = [
  "Flask==3.1.3",
  "argon2-cffi==25.1.0",
  "kubernetes==36.0.3",
  "gunicorn==23.0.0",
]

[project.scripts]
kcp = "kcp.__main__:main"

[tool.setuptools]
packages = ["kcp"]

[tool.setuptools.package-data]
kcp = ["assets/k8s-docs/*", "static/*"]
